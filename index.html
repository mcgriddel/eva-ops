<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eva Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,600&family=Albert+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { --ivory:#F4F2EE; --paper:#ECE9E2; --ink:#141311; --soft:#454239; --grey:#9B978F; --line:#D6D2C8; --ok:#1F7A4D; --terra:#B0562F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ivory); color:var(--ink); font:15px/1.5 'Albert Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; }
  header { display:flex; align-items:baseline; gap:10px; padding:14px 18px; border-bottom:2px solid var(--ink); position:sticky; top:0; background:var(--ivory); z-index:5; }
  header h1 { font-family:'Bodoni Moda', Didot, Georgia, serif; font-style:italic; font-weight:600; font-size:25px; letter-spacing:.01em; }
  nav { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  nav button { border:1px solid var(--line); background:var(--paper); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; }
  nav button.on { background:var(--ink); color:var(--ivory); border-color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .muted { color:var(--grey); font-size:12.5px; }
  .sect { display:flex; align-items:baseline; gap:8px; margin:24px 0 8px; }
  .sect:first-child { margin-top:6px; }
  .sect h2 { margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.09em; font-weight:700; }
  .sect .muted { font-size:12px; }
  .sect .tb { margin-left:auto; }

  /* THE card — one component for every booking, in every section. */
  /* padding-left 14 + the 3px terracotta edge = the quiet card's 16 + 1px hairline: text lines up */
  .q { background:#fff; border:1px solid var(--line); border-left:3px solid var(--terra); border-radius:10px; padding:13px 16px 13px 14px; margin-bottom:10px; }
  /* same card; the accent edge and the solid answer are the only things "your move" adds */
  .q.quiet { border-left:3px solid var(--line); }
  /* the booking as a labelled record: the client names it, the fields spell it out. */
  .q .qt { display:flex; align-items:baseline; gap:10px; font-size:17px; font-weight:600; line-height:1.3; }
  .q .qt .tw { font-size:14px; font-weight:500; color:var(--soft); font-variant-numeric:tabular-nums; }
  .q .qt .tel { margin-left:auto; font-size:13px; font-weight:500; color:var(--grey); text-decoration:none; white-space:nowrap; }
  .q .qt .tel:hover { color:var(--ink); text-decoration:underline; }
  .rec { display:grid; grid-template-columns:auto 1fr; gap:5px 14px; margin-top:11px; font-size:14px; align-items:baseline; }
  .rec dt { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grey); white-space:nowrap; }
  .rec dd { color:var(--ink); min-width:0; }
  .rec dd.st { font-weight:600; }   /* a state's status reads the same however long it has run */
  .qm .late { color:var(--terra); font-weight:600; }  /* only the CLOCK says it has gone on too long */
  .rec dd.said { color:var(--soft); font-style:italic; }
  .q .qq { color:var(--soft); font-size:13.5px; margin-top:6px; padding-left:10px; border-left:2px solid var(--line); }
  .q .qh { color:var(--grey); font-size:12px; margin-top:7px; }
  .q .qm { color:var(--grey); font-size:12px; margin-top:9px; display:flex; gap:12px; align-items:baseline; }
  .zen { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; color:var(--soft); font-size:14.5px; }
  .zen b { color:var(--ok); }

  /* verbs — the pre-rebuild palette: solid ink yes · hairline terracotta no · ink-outline mid */
  .verbs { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; align-items:center; }
  .v { display:inline-flex; align-items:center; justify-content:center; border:1.5px solid var(--ink); background:#fff; color:var(--ink); border-radius:9px; padding:9px 18px; font-weight:650; font-size:14px; min-height:40px; cursor:pointer; font-family:inherit; text-decoration:none; transition:background .15s, border-color .15s, opacity .15s; }
  .v:hover { background:var(--paper); }
  .v.pri { background:var(--ink); border-color:var(--ink); color:var(--ivory); }
  .v.pri:hover { background:var(--ink); opacity:.85; }
  .v.dgr { border-color:var(--line); color:var(--terra); }
  .v.dgr:hover { background:#fff; border-color:var(--terra); }
  .vq { border:0; background:none; color:var(--soft); font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:9px 4px; font-family:inherit; }
  .tb { border:0; background:none; color:var(--grey); font-size:12px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0; font-family:inherit; }

  .tl { border-left:2px solid var(--line); margin:8px 0 2px; padding-left:10px; display:flex; flex-direction:column; gap:3px; }
  .tl div { color:var(--grey); font-size:12px; }
  .tl b { color:var(--soft); }

  input, select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:#fff; margin-top:6px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(20,19,17,.08); }
  label { font-size:11.5px; font-weight:700; color:var(--soft); text-transform:uppercase; letter-spacing:.08em; display:block; margin-top:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11.5px; font-weight:700; border:1px solid var(--line); background:var(--paper); }
  .pill.live { background:#E0F0E7; color:var(--ok); }
  button.act { border:1px solid var(--ink); background:var(--ink); color:var(--ivory); padding:9px 14px; border-radius:8px; font-weight:600; cursor:pointer; font-size:13.5px; min-height:40px; }
  button.ghost { background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  form .act { margin-top:14px; }
  #login { max-width:380px; margin:10vh auto; padding:26px 26px 24px; }
  #login h2 { margin:0 0 4px; font-size:20px; }
  .btnrow { display:flex; gap:10px; margin-top:22px; }
  .btnrow .act { flex:1; }
  .thread { max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:8px 0; }
  .msg { max-width:80%; padding:8px 12px; border-radius:12px; font-size:14px; }
  .msg.in { background:#fff; border:1px solid var(--line); align-self:flex-start; }
  .msg.out { background:var(--ink); color:var(--ivory); align-self:flex-end; }
  .badge { background:var(--terra); color:#fff; border-radius:999px; font-size:11px; padding:1px 8px; font-weight:700; }
  h2 { font-size:16px; margin:18px 0 10px; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--ivory); padding:10px 18px; border-radius:999px; font-size:13.5px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9; }
  .toast.undoable { pointer-events:auto; display:flex; gap:14px; align-items:center; }
  .toast button { border:0; background:none; color:var(--ivory); font-weight:700; text-decoration:underline; cursor:pointer; font-size:13.5px; font-family:inherit; }
</style>
</head>
<body>
<header><h1>eva</h1><span class="muted">console</span>
  <nav id="nav" style="display:none">
    <button data-t="bookings">Today <span id="bookBadge"></span></button>
    <button data-t="inbox">Inbox <span id="inboxBadge"></span></button>
    <button data-t="deals">Deals</button>
    <button data-t="salons">Salons</button>
    <button data-t="out" class="ghost">Sign out</button>
  </nav>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient('https://iapwfxbfwlnibyucetca.supabase.co', 'sb_publishable_3XDoudJTZYbZNPjajzsccg_pTqf0F-U');
const FN = 'https://iapwfxbfwlnibyucetca.supabase.co' + '/functions/v1/ops-send';
const app = document.getElementById('app');
let tab = 'bookings', session = null, timer = null, openPhone = null, historyQuery = '', archiveMode = false;
const proposeOpen = {}; // booking id → the "suggest a change" editor is open
const noShowOpen = {};  // booking id → the no-show reason input is open
const moreOpen = {};    // booking id → the secondary actions are revealed
const tlOpen = {};      // booking id → conversation shown inside question/detail
let undoTimer = null;

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t = document.getElementById('toast'); t.className = 'toast'; t.textContent = m; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2600); }
function undoToast(m, prev, id){
  const t = document.getElementById('toast');
  t.className = 'toast undoable'; t.innerHTML = esc(m) + ' <button id="undoBtn">Undo</button>'; t.style.opacity = 1;
  clearTimeout(undoTimer);
  document.getElementById('undoBtn').onclick = async () => {
    await sb.from('bookings').update({ ...prev, updated_at: new Date().toISOString() }).eq('id', id);
    t.style.opacity = 0; refresh();
  };
  undoTimer = setTimeout(() => { t.style.opacity = 0; }, 6000);
}
async function ops(body){
  const r = await fetch(FN, { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':'sb_publishable_3XDoudJTZYbZNPjajzsccg_pTqf0F-U', 'Authorization':'Bearer ' + session.access_token }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) toast(j.error || ('Error ' + r.status));
  else if(j.send_error) toast('Saved. WhatsApp send: ' + j.send_error);
  return j;
}

function loginView(){
  document.getElementById('nav').style.display = 'none';
  app.innerHTML = '<div id="login" class="card"><h2 style="margin-top:0">Sign in</h2>' +
    '<label>Email</label><input id="em" type="email" autocomplete="username">' +
    '<label>Password</label><input id="pw" type="password" autocomplete="current-password">' +
    '<div class="btnrow"><button class="act" id="si">Sign in</button><button class="act ghost" id="su">Create account</button></div>' +
    '<p class="muted" style="margin-top:14px">Team accounts only. First time? Create your account, confirm the email Supabase sends you, then sign in.</p></div>';
  document.getElementById('si').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if(error) toast(error.message);
  };
  document.getElementById('su').onclick = async () => {
    const { error } = await sb.auth.signUp({ email: em.value.trim(), password: pw.value });
    toast(error ? error.message : 'Account created — check your email to confirm, then sign in.');
  };
}

async function inboxView(){
  const { data: msgs, error } = await sb.from('wa_messages').select('*').order('created_at', { ascending:false }).limit(300);
  if(error){ app.innerHTML = '<p class="muted">' + esc(error.message) + '</p>'; return; }
  const by = {};
  for(const m of (msgs || [])){ (by[m.customer_phone] = by[m.customer_phone] || []).push(m); }
  const phones = Object.keys(by);
  const unread = phones.filter(p => by[p].some(m => m.direction === 'in' && !m.handled)).length;
  document.getElementById('inboxBadge').innerHTML = unread ? '<span class="badge">' + unread + '</span>' : '';
  if(openPhone && by[openPhone]){ return threadView(openPhone, by[openPhone]); }
  openPhone = null;
  if(!phones.length){ app.innerHTML = '<p class="muted">No WhatsApp conversations yet. They will appear here the moment the Eva number is live.</p>'; return; }
  app.innerHTML = phones.map(p => {
    const last = by[p][0]; const needs = by[p].some(m => m.direction === 'in' && !m.handled);
    const side = by[p].some(m => m.party === 'salon') ? ' <span class="pill">salon</span>' : '';
    return '<div class="card row" style="cursor:pointer" data-p="' + esc(p) + '">' +
      '<div><strong>+' + esc(p) + '</strong>' + side + (needs ? ' <span class="badge">needs reply</span>' : '') +
      '<div class="muted">' + esc((last.body || '').slice(0, 80)) + '</div></div>' +
      '<span class="muted">' + new Date(last.created_at).toLocaleString() + '</span></div>';
  }).join('');
  app.querySelectorAll('[data-p]').forEach(el => el.onclick = () => { openPhone = el.dataset.p; refresh(); });
}

function threadView(phone, msgs){
  const items = msgs.slice().reverse();
  app.innerHTML = '<button class="act ghost" id="back">← All conversations</button>' +
    '<h2>+' + esc(phone) + '</h2><div class="thread">' +
    items.map(m => '<div class="msg ' + m.direction + '">' + esc(m.body || '(media)') + '<div class="muted" style="font-size:10.5px">' + new Date(m.created_at).toLocaleTimeString() + (m.sent_by === 'ops' ? ' · you' : '') + '</div></div>').join('') +
    '</div><label>Reply (customers get this in French — write it as Eva)</label><textarea id="rt" rows="2"></textarea>' +
    '<button class="act" id="send">Send</button>';
  document.getElementById('back').onclick = () => { openPhone = null; refresh(); };
  document.getElementById('send').onclick = async () => {
    const text = document.getElementById('rt').value.trim(); if(!text) return;
    await ops({ action:'reply', phone, text }); refresh();
  };
}

// ————— TODAY: one card per booking, whatever its state —————

const TZ = 'Africa/Casablanca';
const TODAY = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
const TOMORROW = () => new Date(Date.now() + 86400000).toLocaleDateString('en-CA', { timeZone: TZ });
function slotPassed(b){
  if(!b.slot_date) return false;
  return new Date(b.slot_date + 'T' + (b.slot_time || '23:59')) < new Date();
}
const hh = t => (t || '').slice(0,5).replace(':','h');
const hhmmT = ts => new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
const ageMin = ts => Math.round((Date.now() - new Date(ts)) / 60000);
const ageLabel = m => m >= 60 ? Math.floor(m/60) + 'h' + String(m%60).padStart(2,'0') : m + 'm';
function dayWord(d){
  if(!d) return '';
  if(d === TODAY()) return '';
  if(d === TOMORROW()) return 'tomorrow ';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) + ' ';
}
const whenStr = b => dayWord(b.slot_date) + (b.slot_time ? hh(b.slot_time) : '');
const teamStr = b => (b.notes || '').startsWith('Avec : ') ? ' ' + esc(b.notes.replace('Avec : ', 'avec ')) : (b.practitioners?.first_name ? ' avec ' + esc(b.practitioners.first_name) : '');
const first = s => esc((s || 'La cliente').split(' ')[0]);

function ticksStr(ping){
  if(!ping) return '';
  if(ping.wa_error) return 'ping failed';
  if(ping.wa_status === 'read') return 'seen ✓✓';
  if(ping.wa_status === 'delivered') return 'delivered ✓✓';
  if(ping.wa_status === 'sent') return 'sent ✓';
  return '';
}

// the closed status vocabulary — one chip per state, never a sentence
// ————— ONE CARD MODEL for every booking on the page —————
// Four fixed zones, always in this order, whatever the state:
//   ① stage chip (closed vocabulary — the stable anchor) · who → salon · the clock that matters now
//   ② the slot, always labelled, plus what was booked
//   ③ one plain sentence saying what is happening
//   ④ at most two answers, the rest behind « More », then the evidence row
// Only two things change with whose move it is: the terracotta edge and the solid answer.

const V = (a, label, kind) => ({ a, label, kind: kind || '' });

function slotStr(b){
  if(!b.slot_date) return 'no slot set';
  const d = b.slot_date === TODAY() ? 'today' : b.slot_date === TOMORROW() ? 'tomorrow'
    : new Date(b.slot_date + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  return d + (b.slot_time ? ' ' + hh(b.slot_time) : '');
}
function untilStr(b){
  if(!b.slot_date || !b.slot_time) return null;
  const m = Math.round((new Date(b.slot_date + 'T' + b.slot_time) - Date.now()) / 60000);
  if(m < 0) return null;
  if(m < 60) return 'starts in ' + m + 'm';
  const h = Math.floor(m / 60);
  if(h < 24) return 'starts in ' + h + 'h' + String(m % 60).padStart(2, '0');
  return 'starts in ' + Math.round(h / 24) + ' day' + (Math.round(h / 24) > 1 ? 's' : '');
}
function passedStr(b){
  if(!b.slot_date) return null;
  const m = Math.round((Date.now() - new Date(b.slot_date + 'T' + (b.slot_time || '23:59'))) / 60000);
  return m > 0 ? 'slot passed ' + ageLabel(m) + ' ago' : null;
}
const askedStr = b => 'asked ' + ageLabel(ageMin(b.created_at)) + ' ago';
// +212612345678 → « +212 6 12 34 56 78 » (Moroccan mobiles read in pairs); anything else groups in 3s
function telStr(raw){
  const d = String(raw || '').replace(/\D/g, '');
  if(!d) return '';
  if(d.startsWith('212') && d.length === 12) return '+212 ' + d[3] + ' ' + d.slice(4).replace(/(\d{2})(?=\d)/g, '$1 ');
  return '+' + d.replace(/(\d{3})(?=\d)/g, '$1 ');
}

function cardOf(b, helpers){
  const { pingOf, lastSalonMsg } = helpers;
  const pend = b.state === 'pending_salon' || b.state === 'received';
  const conf = b.state === 'confirmed' || b.state === 'reminded';
  const she = (b.party_size || 1) > 1 ? 'they' : 'she';
  const ping = pingOf(b);
  const tel = (b.salons?.owner_whatsapp || '').replace(/\D/g, '');
  const decide = [V('confirm', 'Confirm', 'pri'), V('refuse', 'Refuse', 'dgr')];
  const moreP = [V('propose_open', 'Suggest a change'), V('client_cancel', 'Client cancelled')];
  const attend = [V('showed', 'Came', 'pri'), V('noshow_open', 'No-show', 'dgr')];
  const base = { tel, ref: b.ref };
  // TITLE = the booking. SUBTITLE = the status. Nothing else on the card says what this is.

  if(b.needs_review){
    if(b.review_reason === 'salon_reply'){
      const m = lastSalonMsg(b);
      return { ...base, sect: 'confirm', mine: true, timer: askedStr(b),
        say: 'The salon wrote back instead of tapping.',
        quote: m ? '« ' + esc((m.body || '').slice(0, 110)) + ' »' : null,
        primary: decide, more: moreP, ticks: ticksStr(ping) };
    }
    if(b.review_reason === 'no_show_claim')
      return { ...base, sect: 'settle', mine: true, timer: passedStr(b),
        say: 'The salon says ' + she + ' never came.', primary: attend,
        helper: 'Your answer decides the fee.' };
    if(b.review_reason === 'checkin_conflict')
      return { ...base, sect: 'settle', mine: true, timer: passedStr(b),
        say: 'The salon says ' + she + ' came — ' + she + ' says not.',
        primary: [V('resolve', 'Came', 'pri'), V('noshow_confirm', 'No-show', 'dgr')],
        helper: 'Your answer decides the fee.' };
    if(b.review_reason === 'salon_refused')
      return { ...base, sect: 'done', mine: true, timer: null,
        say: 'The salon refused. She has been told and offered another day.',
        primary: [V('resolve', 'OK', 'pri')], more: [] };
    return { ...base, sect: 'confirm', mine: true, timer: null, say: 'Needs a look.',
      primary: [V('resolve', 'OK', 'pri')], more: [] };
  }

  if(pend){
    if(slotPassed(b)) return { ...base, sect: 'confirm', mine: true, late: true, timer: passedStr(b),
      say: 'The slot passed and the salon never answered.',
      primary: decide, more: moreP, ticks: ticksStr(ping), foot: 'the sweep will expire it soon' };
    if(!b.salon_pinged_at) return { ...base, sect: 'confirm', mine: true, timer: askedStr(b),
      say: 'This salon has no WhatsApp — ask them, then answer here.',
      primary: decide, more: moreP };
    if(ping?.wa_error) return { ...base, sect: 'confirm', mine: true, late: true, timer: askedStr(b),
      say: 'WhatsApp couldn’t reach the salon. Call them, then answer here.',
      callPri: true, primary: decide, more: moreP, ticks: 'ping failed' };
    const late = ageMin(b.created_at) > 15;
    return { ...base, sect: 'confirm', mine: late, late, timer: askedStr(b),
      say: 'Waiting for the salon to confirm.', primary: decide, more: moreP, ticks: ticksStr(ping) };
  }

  if(conf){
    if(slotPassed(b)) return { ...base, sect: 'settle', mine: true, late: true, timer: passedStr(b),
      say: 'Did ' + she + ' come?', primary: attend,
      helper: 'Fee applies only if ' + she + ' came.',
      foot: b.checkin_sent_at && !b.client_checkin ? 'the client was asked too — her answer also settles it' : null };
    return { ...base, sect: 'confirmed', mine: false, timer: untilStr(b), say: 'Confirmed. Nothing to do until ' + she + ' arrives.',
      more: [V('salon_cancel', 'Salon cancels'), V('client_cancel', 'Client cancelled')] };
  }

  if(b.state === 'showed') return { ...base, sect: 'done', mine: false, say: 'Came — the fee applies.' };
  if(b.state === 'no_show') return { ...base, sect: 'done', mine: false, say: 'No-show — no fee.',
    foot: b.no_show_reason ? 'reason: ' + esc(b.no_show_reason) : null };
  if(b.state === 'cancelled') return { ...base, sect: 'done', mine: false, say: 'Cancelled.' };
  if(b.state === 'expired') return { ...base, sect: 'done', mine: false, say: 'Expired — the salon never answered in time.' };
  return { ...base, sect: 'done', mine: false, say: esc(b.state) };
}

function verbsHtml(b, m){
  const primary = m.primary || [], more = m.more || [];
  let h = '';
  if(primary.length || more.length || m.callPri){
    h += '<div class="verbs">';
    if(m.callPri && m.tel) h += '<a class="v pri" href="tel:+' + m.tel + '">Call salon</a>';
    for(const x of primary) h += '<button class="v ' + x.kind + '" data-a="' + x.a + '" data-id="' + b.id + '" data-ref="' + esc(b.ref) + '">' + x.label + '</button>';
    if(more.length || (m.tel && !m.callPri))
      h += moreOpen[b.id]
        ? '<button class="vq" data-a="more_close" data-id="' + b.id + '">Fewer</button>'
        : '<button class="vq" data-a="more_open" data-id="' + b.id + '">More…</button>';
    h += '</div>';
  }
  if(moreOpen[b.id]){
    h += '<div class="verbs">';
    if(m.tel && !m.callPri) h += '<a class="v" href="tel:+' + m.tel + '">Call salon</a>';
    for(const x of more) h += '<button class="v" data-a="' + x.a + '" data-id="' + b.id + '" data-ref="' + esc(b.ref) + '">' + x.label + '</button>';
    h += '</div>';
  }
  if(noShowOpen[b.id]) h += '<div class="verbs"><input data-nsr="' + b.id + '" placeholder="reason (optional)" style="max-width:240px;margin:0"><button class="v dgr" data-a="noshow_confirm" data-id="' + b.id + '">Save no-show</button></div>';
  return h;
}
function proposeEditor(b){
  return '<div class="verbs" style="align-items:center">' +
    '<span class="muted">new time</span><input type="time" data-time="' + b.id + '" value="' + esc((b.slot_time || '').slice(0,5)) + '" style="width:112px;margin:0">' +
    '<span class="muted">people</span><input type="number" min="1" max="6" value="' + (b.party_size || 1) + '" data-party="' + b.id + '" style="width:58px;margin:0">' +
    '<button class="v pri" data-a="propose" data-id="' + b.id + '">Send offer</button>' +
    '<button class="vq" data-a="propose_back" data-id="' + b.id + '">back</button></div>' +
    '<div class="qh">The client gets the offer on WhatsApp and decides.</div>';
}
function whoLabel(b, m){
  let side = m.party;
  if(!side){
    const owner = (b.salons?.owner_whatsapp || '').replace(/\D/g, '');
    side = (owner && m.customer_phone === owner && owner !== b.customer_phone) ? 'salon' : 'client';
  }
  const you = m.sent_by === 'ops' ? ' (you)' : '';
  return m.direction === 'in' ? side + ' →' : '→ ' + side + you;
}
function timelineHtml(b, tl){
  if(!tl.length) return '';
  if(!tlOpen[b.id]) return '<button class="tb" data-a="tl_open" data-id="' + b.id + '">Conversation (' + tl.length + ')</button>';
  return '<button class="tb" data-a="tl_close" data-id="' + b.id + '">Hide conversation</button>' +
    '<div class="tl">' + tl.map(m => '<div><span style="font-variant-numeric:tabular-nums">' + hhmmT(m.created_at) + '</span> <b>' + whoLabel(b, m) + '</b> ' +
      esc((m.body || '').slice(0, 64)) + ((m.body || '').length > 64 ? '…' : '') + '</div>').join('') + '</div>';
}

async function bookingsView(){
  const { data: bks, error } = await sb.from('bookings')
    .select('*, deals(service_name), salons(name, owner_whatsapp), practitioners(first_name)')
    .order('created_at', { ascending:false }).limit(200);
  if(error){ app.innerHTML = '<p class="muted">' + esc(error.message) + '</p>'; return; }
  const { data: msgs } = await sb.from('wa_messages')
    .select('booking_id, direction, customer_phone, body, created_at, party, sent_by, msg_type, wa_status, wa_error')
    .in('booking_id', (bks || []).map(b => b.id)).order('created_at');
  const tlById = {};
  for(const m of (msgs || [])){ (tlById[m.booking_id] = tlById[m.booking_id] || []).push(m); }
  const tl = b => tlById[b.id] || [];
  const helpers = {
    pingOf: b => tl(b).filter(m => m.party === 'salon' && m.direction === 'out' && m.msg_type === 'buttons').pop(),
    lastSalonMsg: b => tl(b).filter(m => m.party === 'salon' && m.direction === 'in').pop(),
  };
  const today = TODAY();
  const live = ['pending_salon', 'received', 'confirmed', 'reminded'];
  const isConf = b => b.state === 'confirmed' || b.state === 'reminded';
  const bySlot = (a, c) => String(a.slot_date || '9').localeCompare(String(c.slot_date || '9')) || String(a.slot_time || '').localeCompare(String(c.slot_time || ''));

  const model = new Map();
  for(const b of (bks || [])) model.set(b.id, cardOf(b, helpers));

  // SECTIONS ARE THE LIFECYCLE, held honest by one invariant:
  // two cards offering the same buttons ALWAYS sit in the same section. Urgency is NOT a section —
  // it shows inside the card (terracotta edge, the status line, the timer).
  const inSect = k => (bks || []).filter(b => model.get(b.id).sect === k).sort(bySlot);
  const toConfirm = inSect('confirm');
  const confirmed = inSect('confirmed');
  const toSettle = inSect('settle');
  const done = inSect('done').filter(b => b.slot_date === today ||
      new Date(b.updated_at).toLocaleDateString('en-CA', { timeZone: TZ }) === today)
    .sort((a, c) => String(a.updated_at).localeCompare(String(c.updated_at)));
  const yours = (bks || []).filter(b => model.get(b.id).mine).length;
  const archiveCount = (bks || []).length;
  document.getElementById('bookBadge').innerHTML = yours ? '<span class="badge">' + yours + '</span>' : '';

  function card(b){
    const m = model.get(b.id), t = tl(b);
    const row = (label, val, cls) => '<dt>' + label + '</dt><dd' + (cls ? ' class="' + cls + '"' : '') + '>' + val + '</dd>';
    const phone = (b.customer_phone || '').replace(/\D/g, '');
    let rec = '';
    rec += row('Service', esc(b.deals?.service_name || '?') + teamStr(b) +
      ((b.party_size || 1) > 1 ? ' · ' + b.party_size + ' pers.' : ''));
    rec += row('Salon', esc(b.salons?.name || '?'));
    rec += row('Price', (b.price_mad ?? '?') + ' DH');
    if(m.quote) rec += row('They said', m.quote, 'said');
    rec += row('Status', m.say, 'st');
    const meta = [esc(b.ref)]
      .concat(m.timer ? ['<span class="' + (m.late ? 'late' : '') + '">' + esc(m.timer) + '</span>'] : [])
      .concat(m.ticks ? [esc(m.ticks)] : []).concat(m.foot ? [esc(m.foot)] : []).join(' · ');
    return '<div class="q' + (m.mine ? '' : ' quiet') + '">' +
      '<div class="qt">' + first(b.customer_name) +
        '<span class="tw">' + esc(slotStr(b)) + '</span>' +
        (phone ? '<a class="tel" href="tel:+' + phone + '">' + esc(telStr(phone)) + '</a>' : '') + '</div>' +
      '<dl class="rec">' + rec + '</dl>' +
      (proposeOpen[b.id] ? proposeEditor(b) : verbsHtml(b, m)) +
      (m.helper ? '<div class="qh">' + m.helper + '</div>' : '') +
      '<div class="qm">' + (meta ? '<span>' + meta + '</span>' : '') + timelineHtml(b, t) + '</div>' +
      '</div>';
  }

  if(archiveMode){
    const qs = historyQuery.trim().toLowerCase();
    const shown = qs ? (bks || []).filter(b => [b.ref, b.customer_name, b.customer_phone, b.salons?.name, b.deals?.service_name].some(x => (x || '').toLowerCase().includes(qs))) : (bks || []).slice(0, 20);
    app.innerHTML = '<button class="act ghost" data-arch="off">← Back to today</button>' +
      '<div class="sect"><h2>Archive</h2><span class="muted">' + archiveCount + ' bookings, newest first</span></div>' +
      '<input id="hq" placeholder="search name, salon, ref, phone…" value="' + esc(historyQuery) + '" style="margin-bottom:10px">' +
      shown.map(card).join('') +
      (!qs && archiveCount > 20 ? '<p class="muted" style="text-align:center;margin-top:10px">' + (archiveCount - 20) + ' more — search to find them.</p>' : '');
    wire();
    return;
  }

  const running = toConfirm.length + confirmed.length + toSettle.length;
  let h = '';
  if(!yours) h += '<div class="zen"><b>✓</b> Nothing needs you' +
    (running ? ' — ' + running + ' booking' + (running > 1 ? 's' : '') + ' running on ' + (running > 1 ? 'their' : 'its') + ' own.' : ' today.') + '</div>';
  const section = (title, rows, empty, extra) =>
    '<div class="sect"><h2>' + title + '</h2>' + (rows.length ? '<span class="muted">' + rows.length + '</span>' : '') +
      (extra || '') + '</div>' +
    (rows.length ? rows.map(card).join('') : '<p class="muted">' + empty + '</p>');
  h += section('To confirm', toConfirm, 'Nothing waiting on a salon.');
  h += section('Confirmed', confirmed, 'Nothing booked ahead.');
  h += section('Did they come?', toSettle, 'Nothing to settle.');
  h += section('Done', done, 'Nothing finished yet today.',
    '<button class="tb" data-arch="on" style="margin-left:auto">Archive →</button>');

  app.innerHTML = h;
  wire();

  function wire(){
    const hq = document.getElementById('hq');
    if(hq) hq.oninput = () => { historyQuery = hq.value; clearTimeout(hq._t); hq._t = setTimeout(refresh, 350); };
    app.querySelectorAll('[data-arch]').forEach(el => el.onclick = () => { archiveMode = el.dataset.arch === 'on'; historyQuery = ''; refresh(); });
    app.querySelectorAll('[data-a]').forEach(el => el.onclick = async (e) => {
      e.stopPropagation();
      const id = el.dataset.id, a = el.dataset.a;
      if(a === 'tl_open'){ tlOpen[id] = true; refresh(); return; }
      if(a === 'tl_close'){ delete tlOpen[id]; refresh(); return; }
      if(a === 'more_open'){ moreOpen[id] = true; refresh(); return; }
      if(a === 'more_close'){ delete moreOpen[id]; refresh(); return; }
      if(a === 'propose_open'){ proposeOpen[id] = true; refresh(); return; }
      if(a === 'propose_back'){ delete proposeOpen[id]; refresh(); return; }
      if(a === 'noshow_open'){ noShowOpen[id] = true; refresh(); return; }
      el.disabled = true;
      if(a === 'confirm') await ops({ action:'confirm_booking', booking_id:id });
      else if(a === 'refuse'){
        if(confirm('Refuse this booking? The client will be told the slot isn’t available and offered another day.'))
          await ops({ action:'cancel_booking', booking_id:id });
      }
      else if(a === 'client_cancel'){
        if(confirm('The client cancelled? She gets a short confirmation, nothing else.'))
          await ops({ action:'cancel_booking', booking_id:id, message: "C'est annulé ✔ (" + el.dataset.ref + ") — à très bientôt 🌸" });
      }
      else if(a === 'salon_cancel'){
        if(confirm('The salon cancels this confirmed booking? The client gets the apology and a rebook offer.'))
          await ops({ action:'cancel_confirmed', booking_id:id });
      }
      else if(a === 'resolve') await ops({ action:'resolve_review', booking_id:id });
      else if(a === 'showed'){
        await ops({ action:'mark_showed', booking_id:id });
        undoToast('Came ✓ recorded', { state:'confirmed', showed_source:null }, id);
      }
      else if(a === 'noshow_confirm'){
        await ops({ action:'mark_no_show', booking_id:id, reason: app.querySelector('[data-nsr="' + id + '"]')?.value || undefined });
        undoToast('No-show recorded', { state:'confirmed', no_show_reason:null }, id);
      }
      else if(a === 'propose'){
        const t = app.querySelector('[data-time="' + id + '"]')?.value || undefined;
        const n = app.querySelector('[data-party="' + id + '"]')?.value || undefined;
        await ops({ action:'propose_alternative', booking_id:id, slot_time:t, party_size:n ? +n : undefined });
      }
      delete proposeOpen[id]; delete noShowOpen[id]; delete moreOpen[id];
      refresh();
    });
  }
}

async function dealsView(){
  const [{ data: deals }, { data: salons }] = await Promise.all([
    sb.from('deals').select('*, salons(name)').order('created_at', { ascending:false }),
    sb.from('salons').select('id, name').order('name'),
  ]);
  const D = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  app.innerHTML = (deals || []).map(d =>
    '<div class="card"><div class="row"><strong>' + esc(d.service_name) + '</strong>' +
    '<span class="pill ' + (d.status === 'live' ? 'live' : '') + '">' + esc(d.status) + '</span></div>' +
    '<div class="muted">' + esc(d.salons?.name || '?') + ' · ' + d.deal_price_mad + ' DH instead of ' + d.verified_price_mad + ' DH · ' +
    (d.window_days || []).map(i => D[i]).join('/') + ' ' + esc(String(d.window_start).slice(0,5)) + '–' + esc(String(d.window_end).slice(0,5)) + ' · cap ' + d.cap_per_day + '/day · up to ' + (d.max_party || 1) + ' pers.</div>' +
    '<div class="row" style="margin-top:8px"><button class="act ghost" data-tg="' + d.id + '" data-st="' + (d.status === 'live' ? 'paused' : 'live') + '">' + (d.status === 'live' ? 'Pause' : 'Go live') + '</button>' +
    '<span class="muted">card link: wa message must contain EVA-DEAL:' + d.id + '</span></div></div>'
  ).join('') +
  '<h2>New deal</h2><form class="card" id="nd">' +
  '<label>Salon</label><select id="d_salon">' + (salons || []).map(s => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join('') + '</select>' +
  '<label>Service name (as shown to clients)</label><input id="d_service" required>' +
  '<label>Board price (DH)</label><input id="d_vp" type="number" required>' +
  '<label>Eva price (DH)</label><input id="d_dp" type="number" required>' +
  '<label>Days (tick)</label><div class="row" style="justify-content:flex-start">' + D.map((d, i) => '<label style="display:inline;margin:0 8px 0 0;text-transform:none"><input type="checkbox" style="width:auto" class="dday" value="' + i + '"> ' + d + '</label>').join('') + '</div>' +
  '<div class="row"><div style="flex:1"><label>From</label><input id="d_ws" type="time" value="14:00"></div><div style="flex:1"><label>To</label><input id="d_we" type="time" value="17:00"></div><div style="flex:1"><label>Cap/day</label><input id="d_cap" type="number" value="2"></div><div style="flex:1"><label>Max party</label><input id="d_mp" type="number" value="1" min="1" max="6"></div></div>' +
  '<button class="act">Create deal (draft)</button></form>';
  app.querySelectorAll('[data-tg]').forEach(el => el.onclick = async () => {
    await sb.from('deals').update({ status: el.dataset.st }).eq('id', el.dataset.tg); refresh();
  });
  document.getElementById('nd').onsubmit = async (e) => {
    e.preventDefault();
    const days = [...document.querySelectorAll('.dday:checked')].map(c => +c.value);
    const { error } = await sb.from('deals').insert({
      salon_id: d_salon.value, service_name: d_service.value, verified_price_mad: +d_vp.value,
      deal_price_mad: +d_dp.value, window_days: days, window_start: d_ws.value, window_end: d_we.value,
      cap_per_day: +d_cap.value, max_party: +d_mp.value });
    toast(error ? error.message : 'Deal created (draft)'); if(!error) refresh();
  };
}

async function salonsView(){
  const { data: salons } = await sb.from('salons').select('*').order('created_at', { ascending:false });
  app.innerHTML = (salons || []).map(s =>
    '<div class="card row"><div><strong>' + esc(s.name) + '</strong><div class="muted">' + esc(s.quartier || '') + ' · ' + esc(s.owner_name || '') + ' · ' + esc(s.owner_whatsapp || '') + '</div></div>' +
    '<span class="pill">' + esc(s.status) + '</span></div>').join('') +
  '<h2>New salon</h2><form class="card" id="ns">' +
  '<label>Name</label><input id="s_name" required>' +
  '<label>Quartier</label><input id="s_q">' +
  '<label>Owner name</label><input id="s_owner">' +
  '<label>Owner WhatsApp (e.g. 2126…)</label><input id="s_wa">' +
  '<label>Instagram</label><input id="s_ig">' +
  '<label>Status</label><select id="s_st"><option>prospect</option><option>warm</option><option>onboarding</option><option>live</option></select>' +
  '<label>Notes (dead windows, discount picks…)</label><textarea id="s_notes" rows="2"></textarea>' +
  '<button class="act">Add salon</button></form>';
  document.getElementById('ns').onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.from('salons').insert({ name:s_name.value, quartier:s_q.value, owner_name:s_owner.value, owner_whatsapp:s_wa.value, instagram:s_ig.value, status:s_st.value, notes:s_notes.value });
    toast(error ? error.message : 'Salon added'); if(!error) refresh();
  };
}

function refresh(){
  if(!session) return loginView();
  document.getElementById('nav').style.display = 'flex';
  document.querySelectorAll('#nav [data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  if(tab === 'inbox') inboxView();
  else if(tab === 'bookings') bookingsView();
  else if(tab === 'deals') dealsView();
  else if(tab === 'salons') salonsView();
}
document.getElementById('nav').onclick = async (e) => {
  const t = e.target.closest('[data-t]')?.dataset.t; if(!t) return;
  if(t === 'out'){ await sb.auth.signOut(); return; }
  tab = t; openPhone = null; archiveMode = false; refresh();
};
sb.auth.onAuthStateChange((_e, s) => { session = s; refresh(); });
const { data: { session: s0 } } = await sb.auth.getSession(); session = s0; refresh();
clearInterval(timer); timer = setInterval(() => { if(session && (tab === 'inbox' || tab === 'bookings') && !document.getElementById('rt') && !document.activeElement?.matches?.('input, textarea')) refresh(); }, 10000);
</script>
